name: e2e

# Functional tests of the running system (e2e/backend: WebSocket API, e2e/frontend: real browser), nothing mocked.
# Runs on any change to either app or to the e2e suite itself.
on:
  push:
    branches: [main]
    paths: ['backend/**', 'frontend/**', 'e2e/**', 'scripts/mvnw.mjs', '.github/workflows/e2e.yml']
  pull_request:
    paths: ['backend/**', 'frontend/**', 'e2e/**', 'scripts/mvnw.mjs', '.github/workflows/e2e.yml']

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json

      - run: npm ci
        working-directory: frontend
      - run: npm ci && npx playwright install --with-deps chromium
        working-directory: e2e
      # Playwright starts backend and frontend itself (see e2e/playwright.config.ts).
      - run: npm test
        working-directory: e2e
        env:
          CI: 'true'

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            e2e/playwright-report
            e2e/test-results
